  expressionHelpContextDescription: 小文字のドット区切り名は登録済みフィールド、大文字の
    PAGE、EVENT、SESSION、VISITOR はエンティティ集合です。エンティティセレクター内の $.member
    は現在のエンティティを参照し、-> は集合メンバーを明示的に射影します。@ は時間アンカーで、Sequence と Period の条件には
    $span、$gap、$items もあります。
  expressionHelpContextExamples: |-
    time(last(PAGE)) gte @now-14d
    sequence([EVENT { $.name eq "signup" }, EVENT { $.name eq "purchase" }]) {
      $span lte 14d AND $gap(1, 2) lte 7d AND $same($.payload("/productId"))
    } exists

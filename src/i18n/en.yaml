    wordpress: Add it with a header scripts plugin such as WPCode, or paste it
      before {tag} in your theme's header.php.
    shopify: In Online Store → Themes → Edit code, open theme.liquid and paste it
      before {tag}.
    nextjs: Paste it inside {tag} in app/layout.tsx.

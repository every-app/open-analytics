  expressionHelpOtherFields: Other
  expressionHelpContextTitle: Occurrence time and context intrinsics
  expressionHelpContextDescription: Lowercase dotted names are registered fields;
    uppercase PAGE, EVENT, SESSION, and VISITOR are entity collections. Inside
    an entity selector, $.member refers to its current entity, and -> explicitly
    projects a collection member. @ names a temporal anchor; Sequence and Period
    predicates also provide $span, $gap, and $items.
  expressionHelpContextExamples: |-
    time(last(PAGE)) gte @now-14d
    sequence([EVENT { $.name eq "signup" }, EVENT { $.name eq "purchase" }]) {
      $span lte 14d AND $gap(1, 2) lte 7d AND $same($.payload("/productId"))
    } exists
    periods(EVENT, 1w) { count($items) gte 3 } exists

  analyticsEngineGuideDescription: Analytics Engine needs Cloudflare account
    details and an API token that can read Analytics Engine data.
  analyticsEngineGuideSteps:
    - Open the Cloudflare Dashboard, enter the target account, and copy the
      Account ID.
    - Enable Analytics Engine under Workers & Pages; the Request, Traffic, and
      Event datasets are created and bound automatically during deployment.
    - Go to My Profile → API Tokens and create a Custom token.
    - Grant the token Account Analytics read access and scope it to the current
      account.
    - Copy the token, then enter the Account ID and API token here.
